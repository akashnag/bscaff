name: Validate Completions

on:
  push:
    branches: [ master ]
    paths:
      - 'src/cli.ts'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/cli.ts'

jobs:
  verify-completions:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build completion scripts
        run: npm run build:completions

      - name: Check for uncommitted changes
        run: git diff --exit-code completions/